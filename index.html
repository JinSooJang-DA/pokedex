<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="./assets/img/favicon-pokedex.webp">
    <title>Pokedex</title>
    <link rel="icon" type="image/webp" href="./assets/img/favicon-pokedex.webp">
    
    <link rel="stylesheet" href="./style.css">
</head>

<body onload="init()">
    <div id="loading-spinner" class="spinner-overlay d-none">
        <div class="spinner"></div>
    </div>

    <header class="header">
        <img src="./assets/img/pokedex-title.webp" alt="Pokédex Logo" class="pokedex-logo">
        <input type="text" id="search-input" oninput="filterPokemon()" placeholder="Search Pokémon...">
    </header>

    <main>
        <div id="pokedex-container"></div>
        <button id="load-more-btn" onclick="loadMorePokemon()">Load More</button>
    </main>

    <dialog id="pokemon-modal" data-id="dialog" onclick="handleBackdropClick(event)">
        <div class="modal-content" data-id="overlay-pokemon-name">
            <div id="modal-body"></div>
        </div>
    </dialog>
    
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
</body>

</html>
