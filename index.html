<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="loading-spinner" class="spinner-overlay d-none">
        <div class="spinner"></div>
    </div>

    <header class="header">
        <img src="./assets/img/pokedex-title.webp" alt="Pokédex Logo" class="pokedex-logo">
        <input type="text" id="search-input" oninput="filterPokemon()" placeholder="Search Pokémon...">
    </header>

    <main>
        <div id="pokedex-container"></div>
        <button id="load-more-btn" onclick="loadMorePokemon()">Load More</button>
    </main>

    <div id="pokemon-modal" class="modal-overlay d-none" onclick="closeModal()">

        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">X</button>
            <div id="modal-body">

            </div>
        </div>
    </div>
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
</body>

</html>
