<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="./assets/img/favicon-pokedex.webp">
    <title>Pokedex</title>
    <link rel="icon" type="image/webp" href="./assets/img/favicon-pokedex.webp">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/backtotopbtn.css">
    <link rel="stylesheet" href="./styles/header.css">
</head>

<body onload="init()">
    <div id="loading-spinner" class="spinner-overlay d-none">
        <div class="spinner"></div>
    </div>

    <header class="header">
        <div class="logo-container">
            <div class="arcade-controller left-stick">
                <input type="checkbox" id="auto-scroll-toggle" class="joystick-input">
                <label for="auto-scroll-toggle" class="joystick-base" title="Auto Scroll On/Off">
                    <div class="joystick-stick">
                        <div class="joystick-ball"></div>
                    </div>
                </label>
                <span class="arcade-label">AUTO LOADING</span>
            </div>

            <img src="./assets/img/pokedex-title.webp" alt="Pokédex" class="pokedex-logo">
            <div class="arcade-controller right-buttons">
                <div class="arcade-btn-group">
                    <button type="button" class="arcade-btn btn-red" id="btn-top" title="Scroll to Top">
                        <span>A</span>
                    </button>
                    <button type="button" class="arcade-btn btn-blue" id="btn-sound" title="Action">
                        <span>B</span>
                    </button>
                </div>
                <span class="arcade-label">SUPRISE!</span>
            </div>
        </div>

        <input type="text" id="search-input" oninput="filterPokemon()" placeholder="Search Pokémon...">
    </header>

    <main>
        <div id="pokedex-container"></div>
        <button id="load-more-btn" onclick="loadMorePokemon()">Load More</button>
    </main>

    <dialog id="pokemon-modal" data-id="dialog" onclick="handleBackdropClick(event)">
        <div class="modal-content" data-id="overlay-pokemon-name">
            <div id="modal-body"></div>
        </div>
    </dialog>
    <button type="button" id="back-to-top-btn" class="back-to-top-btn" title="Back to Top">
        <img src="./assets/img/favicon-pokedex.webp" alt="Top" class="top-ball-icon">
    </button>
    <div id="giant-pikachu" class="giant-pikachu-overlay" onclick="closeGiantPikachu()">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
            alt="Giant Pikachu">
    </div>

    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
</body>

</html>
